<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aquinas Q&amp;A</title>
<link rel="stylesheet" href="/qa.css">
<script type="module" src="/qa.js"></script>
</head>
<body>
<main>
<h1>Aquinas Q&amp;A</h1>
<p id="disclosure">Choose English or Hungarian. Answers use a limited source collection and may contain errors. Questions and excerpts are processed by OpenAI. Three answers per browser per UTC day, subject to a shared monthly budget.</p>
<a id="canonical" hidden>Open Aquinas Q&amp;A</a>
<form>
<label for="language">Language / Nyelv</label>
<select id="language" required>
<option value="">Select / Válasszon</option>
<option value="hu">Magyar</option>
<option value="en">English</option>
</select>
<label for="question" id="question-label">Question / Kérdés</label>
<textarea id="question" required rows="5"></textarea>
<button type="submit" disabled>Ask / Kérdezés</button>
</form>
<p id="status" role="status"></p>
<article id="answer" aria-live="polite"></article>
</main>
</body>
</html>
