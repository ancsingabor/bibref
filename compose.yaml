services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.vercel
    ports:
      - "127.0.0.1:8090:80"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      BIBREF_NAMESPACE: local
      BIBREF_COOKIE_SECRET: local-development-secret-not-for-public-deployment
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bibref-sessions:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
volumes:
  bibref-sessions:
